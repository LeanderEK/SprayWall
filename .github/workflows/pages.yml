# Publishes the app (only the `site` folder) to GitHub Pages every time `main` is pushed.
# Once, in the repository: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: List the files to save for offline use and set the version
        run: python3 tools/stamp.py
      # After the step above, so the phone does not save the 3.7 MB wall pack with the app: it is only a download.
      - name: Add the wall and climbs downloads
        run: cp -r wall site/wall
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
